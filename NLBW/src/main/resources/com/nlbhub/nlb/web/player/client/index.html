<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NLB</title>
<link rel="stylesheet" href="static/player.css">
</head>
<body>
<div id="library" class="library" hidden>
  <h1 id="library-title">NLB</h1>
  <ul id="books" class="books"></ul>
</div>
<div id="game" class="game" hidden>
  <div id="stage" class="stage">
    <img id="stage-theme-bg" class="stage-image" alt="" hidden>
    <img id="stage-picture" class="stage-image" alt="" hidden>
    <div id="stage-objects" class="stage-objects"></div>
    <div id="stage-panel" class="stage-panel" hidden></div>
    <div id="stage-band" class="stage-band" hidden></div>
    <div id="stage-header" class="stage-header" hidden></div>
    <div id="stage-text" class="stage-text" hidden><div id="stage-text-inner"></div></div>
    <div id="stage-up" class="stage-arrow" hidden></div>
    <div id="stage-down" class="stage-arrow" hidden></div>
    <div id="stage-choices" class="stage-choices" hidden></div>
    <div id="stage-inventory" class="stage-inventory" hidden></div>
    <button id="stage-menu-button" class="stage-menu-button" type="button"></button>
    <div id="stage-hint" class="stage-hint" hidden></div>
  </div>
</div>
<div id="error" class="error" hidden></div>
<div id="toasts" class="toasts"></div>
<div id="dialog" class="dialog" hidden>
  <div class="dialog-box">
    <div id="dialog-body"></div>
  </div>
</div>
<script src="static/screen.js"></script>
<script src="static/player.js"></script>
</body>
</html>
